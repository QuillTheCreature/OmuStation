- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobChimerafolk
  name: Urist McChin
  abstract: true
  components:
  - type: Hunger
  - type: Icon # It will not have an icon in the adminspawn menu without this. Body parts seem fine for whatever reason.
    sprite: Mobs/Species/Human/parts.rsi
    state: full
  - type: Thirst
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: HumanoidAppearance
    species: Human
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Sprinter
    staminaDrainRate: 8
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
    - map: ["enum.HumanoidVisualLayers.Groin"]
    - map: ["enum.HumanoidVisualLayers.Chest"]
    - map: ["enum.HumanoidVisualLayers.Head"]
    - map: ["enum.HumanoidVisualLayers.Snout"]
    - map: ["enum.HumanoidVisualLayers.Eyes"]
      shader: unshaded
    - map: ["enum.HumanoidVisualLayers.RArm"]
    - map: ["enum.HumanoidVisualLayers.LArm"]
    - map: ["enum.HumanoidVisualLayers.RLeg"]
    - map: ["enum.HumanoidVisualLayers.LLeg"]
    - map: [ "enum.HumanoidVisualLayers.Underwear" ]
    - map: [ "enum.HumanoidVisualLayers.Undershirt" ]
    - shader: StencilClear
      sprite: Mobs/Species/Human/parts.rsi
      state: l_leg
    - shader: StencilMask
    - map: ["enum.HumanoidVisualLayers.StencilMask"]
      sprite: Mobs/Customization/masking_helpers.rsi
      state: full
      visible: false
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["socks"]
    - map: ["underpants"]
    - map: ["undershirt"]
    - map: ["jumpsuit"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: ["id"]
    - map: ["gloves"]
    - map: ["shoes"]
    - map: ["ears"]
    - map: ["innerBelt"]
    - map: ["innerNeck"]
    - map: [ "belt" ]
    - map: ["outerClothing"]
    - map: ["eyes"]
    - map: [ "beltalt" ]
    - map: ["back"]
    - map: ["neck"]
    - map: [ "enum.HumanoidVisualLayers.Face" ]
    - map: ["enum.HumanoidVisualLayers.FacialHair"]
    - map: ["enum.HumanoidVisualLayers.Hair"]
    - map: ["enum.HumanoidVisualLayers.HeadSide"]
    - map: ["enum.HumanoidVisualLayers.HeadTop"]
    - map: ["mask"]
    - map: ["head"]
    - map: ["pocket1"]
    - map: ["pocket2"]
    - map: [ "enum.HumanoidVisualLayers.Wings" ]
    - map: ["enum.HumanoidVisualLayers.Tail"]
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost

- type: entity
  parent: BaseSpeciesDummy
  id: MobChimerafolkDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
